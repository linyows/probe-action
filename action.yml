name: 'Probe Action'
description: 'Run probe workflow automation tool'
author: 'linyows'

inputs:
  path:
    description: 'Path to the workflow YAML file'
    required: false
  paths:
    description: 'Array of paths to the workflow YAML files'
    required: false
  version:
    description: 'Version of probe to use (default: latest)'
    required: false
    default: 'latest'
  options:
    description: 'Command line options for probe (e.g., "--verbose --rt")'
    required: false
    default: ''
  workdir:
    description: 'Working directory to change to before running probe'
    required: false
    default: ''
  action-debug:
    description: 'Enable action debug output (true/false/yes/1)'
    required: false
    default: 'false'
  cache:
    description: 'Cache the probe binary across runs via actions/cache (set to false to disable)'
    required: false
    default: 'true'
  github-token:
    description: 'Token used for GitHub API calls (resolving the latest version) to avoid rate limiting'
    required: false
    default: ${{ github.token }}

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'activity'
  color: 'blue'
