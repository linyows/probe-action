name: 'Probe Action'
description: 'Run probe workflow automation tool'
author: 'linyows'

inputs:
  path:
    description: 'Path to the workflow YAML file'
    required: false
  paths:
    description: 'Array of paths to the workflow YAML files'
    required: false
  version:
    description: 'Version of probe to use (default: latest)'
    required: false
    default: 'latest'
  options:
    description: 'Command line options for probe (e.g., "--verbose --rt")'
    required: false
    default: ''
  workdir:
    description: 'Working directory to change to before running probe'
    required: false
    default: ''
  action-debug:
    description: 'Enable action debug output (true/false/yes/1)'
    required: false
    default: 'false'
  cache:
    description: 'Cache the probe binary across runs via actions/cache (set to false to disable)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve probe version
      id: resolve
      run: |
        VERSION=$(bash "${{ github.action_path }}/resolve-version.sh" "${{ inputs.version }}" "${{ inputs.action-debug }}")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Cache probe binary
      if: ${{ inputs.cache != 'false' }}
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/probe-cache
        key: probe-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}

    - name: Download and run probe
      run: |
        # Determine paths to process
        PATHS=""
        if [ -n "${{ inputs.paths }}" ]; then
          # GitHub Actions passes multiline strings as-is
          PATHS="${{ inputs.paths }}"
        elif [ -n "${{ inputs.path }}" ]; then
          PATHS="${{ inputs.path }}"
        else
          echo "Error: Either 'path' or 'paths' input must be provided"
          exit 1
        fi

        # Run the external script with the resolved version. When caching is
        # enabled, PROBE_CACHE_DIR points at the actions/cache path above so the
        # binary is restored/saved; when disabled it is empty and run.sh falls
        # back to a non-persistent directory.
        bash "${{ github.action_path }}/run.sh" "$PATHS" "${{ steps.resolve.outputs.version }}" "${{ inputs.options }}" "${{ inputs.workdir }}" "${{ inputs.action-debug }}"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PROBE_CACHE_DIR: ${{ inputs.cache != 'false' && format('{0}/probe-cache', runner.temp) || '' }}

branding:
  icon: 'activity'
  color: 'blue'
