name: Test Probe Action

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-basic:
    name: Test Basic HTTP Functionality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test basic HTTP with default settings
        uses: ./
        with:
          path: test/basic-http.yml

      - name: Test with verbose output
        uses: ./
        with:
          path: test/basic-http.yml
          options: '--verbose'

      - name: Test with action debug
        uses: ./
        with:
          path: test/basic-http.yml
          action-debug: true

  test-status-codes:
    name: Test Status Code Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test status code checking
        uses: ./
        with:
          path: test/status-check.yml
          options: '--verbose'

  test-probe-versions:
    name: Test Different Probe Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        probe-version: ['latest', 'v0.20.1']
    steps:
      - uses: actions/checkout@v4

      - name: Test with probe ${{ matrix.probe-version }}
        uses: ./
        with:
          path: test/basic-http.yml
          version: ${{ matrix.probe-version }}

  test-cache-disabled:
    name: Test With Caching Disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run with cache disabled
        uses: ./
        with:
          path: test/basic-http.yml
          version: v0.20.1
          cache: false

  test-platforms:
    name: Test Cross-Platform
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test on ${{ matrix.os }}
        uses: ./
        with:
          path: test/basic-http.yml
          options: '--verbose'

  test-caching:
    name: Test Version Resolution and Binary Caching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve-version.sh returns a concrete tag unchanged
        run: |
          out=$(bash resolve-version.sh v0.20.1 false)
          echo "resolved: $out"
          [ "$out" = "v0.20.1" ] || { echo "FAIL: expected v0.20.1, got '$out'"; exit 1; }
        shell: bash

      - name: resolve-version.sh resolves 'latest' to a versioned tag
        run: |
          out=$(bash resolve-version.sh latest false)
          echo "resolved latest: $out"
          echo "$out" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+' || { echo "FAIL: unexpected '$out'"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash

      - name: Binary is downloaded once, then re-download is skipped
        run: |
          export PROBE_CACHE_DIR="$RUNNER_TEMP/probe-cache-test"

          # First run should download the binary. Capture output and the exit
          # code so a genuine failure fails the test instead of being masked.
          set +e
          out1=$(bash run.sh test/basic-http.yml v0.20.1 "" "" true 2>&1)
          rc1=$?
          set -e
          echo "$out1"
          [ "$rc1" -eq 0 ] || { echo "FAIL: first run exited $rc1"; exit 1; }
          echo "$out1" | grep -q "Downloading from" \
            || { echo "FAIL: expected a download on the first run"; exit 1; }

          # Second run should reuse the cached binary
          set +e
          out2=$(bash run.sh test/basic-http.yml v0.20.1 "" "" true 2>&1)
          rc2=$?
          set -e
          echo "$out2"
          [ "$rc2" -eq 0 ] || { echo "FAIL: second run exited $rc2"; exit 1; }
          echo "$out2" | grep -q "skipping download" \
            || { echo "FAIL: expected the second run to skip the download"; exit 1; }

          # Only the binary should remain in the cache dir (no archive)
          [ ! -f "$PROBE_CACHE_DIR/probe.tar.gz" ] \
            || { echo "FAIL: probe.tar.gz should have been removed"; exit 1; }
          echo "PASS"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash

  test-marketplace:
    name: Test Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test single workflow
        uses: linyows/probe-action@main
        with:
          path: test/basic-http.yml

      - name: Test multiple workflows
        uses: linyows/probe-action@main
        with:
          paths: |
            test/basic-http.yml
            test/status-check.yml
          action-debug: true
